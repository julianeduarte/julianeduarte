<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes float1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes float2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes blink  { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes scan   { 0%{transform:translateY(0)} 100%{transform:translateY(16px)} }
    @keyframes pulse  { 0%,100%{opacity:0.6} 50%{opacity:1} }
    @keyframes drift  { 0%{transform:translateX(0)} 50%{transform:translateX(3px)} 100%{transform:translateX(0)} }
    @keyframes twinkle{ 0%,100%{opacity:0.3} 50%{opacity:1} }
    @keyframes glow   { 0%,100%{opacity:0.5} 50%{opacity:0.9} }

    .float1 { animation: float1 3.2s ease-in-out infinite; }
    .float2 { animation: float2 2.8s ease-in-out infinite 0.4s; }
    .blink  { animation: blink 1s step-end infinite; }
    .pulse  { animation: pulse 2s ease-in-out infinite; }
    .drift  { animation: drift 4s ease-in-out infinite; }
    .twinkle0 { animation: twinkle 1.8s ease-in-out infinite; }
    .twinkle1 { animation: twinkle 2.4s ease-in-out infinite 0.6s; }
    .twinkle2 { animation: twinkle 1.5s ease-in-out infinite 1.1s; }
    .twinkle3 { animation: twinkle 2.1s ease-in-out infinite 0.3s; }
    .glow1  { animation: glow 2.5s ease-in-out infinite; }
  </style>
</defs>


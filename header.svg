<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 4px #a142f4) drop-shadow(0 0 8px #a142f4); }
        50% { filter: drop-shadow(0 0 2px #a142f4) drop-shadow(0 0 4px #a142f4); }
      }
      
      @keyframes blink { 
        0%, 50% { opacity: 1; } 
        51%, 100% { opacity: 0; } 
      }
      
      @keyframes float { 
        0% { transform: translateY(0px); } 
        50% { transform: translateY(-6px); } 
        100% { transform: translateY(0px); } 
      }

      .bg { fill: #0d0417; } /* Fundo roxo super escuro (estilo dark mode) */
      
      .text-name {
        font-family: 'Press Start 2P', monospace;
        font-size: 36px;
        fill: #d8a1ff; /* Roxo claro/neon */
        animation: glow 3s infinite;
      }
      
      .text-cursor {
        font-family: 'Press Start 2P', monospace;
        font-size: 38px;
        fill: #b542f4; /* Roxo vibrante */
        animation: blink 1.2s infinite step-end;
      }
      
      .text-role {
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        fill: #a270d6; /* Roxo médio/acinzentado para subtítulo */
      }
      
      .text-role-highlight { 
        fill: #e6ccff; /* Destaque quase branco */
      }
      
      .pixel-icon { 
        fill: #8a2be2; 
      }
    </style>
  </defs>

  <rect class="bg" width="850" height="250" rx="12" />

  <g transform="translate(60, 95)" style="animation: float 4s infinite ease-in-out;">
     <rect x="0" y="20" width="40" height="30" class="pixel-icon" shape-rendering="crispEdges"/>
     <path d="M 8 20 V 10 H 32 V 20 H 26 V 14 H 14 V 20 Z" fill="#8a2be2" shape-rendering="crispEdges"/>
     <rect x="16" y="30" width="8" height="12" fill="#0d0417" shape-rendering="crispEdges"/>
  </g>

  <g transform="translate(750, 95)" style="animation: float 4s infinite ease-in-out 1s;">
     <rect x="0" y="20" width="40" height="30" class="pixel-icon" shape-rendering="crispEdges"/>
     <path d="M 8 20 V 10 H 32 V 20 H 26 V 14 H 14 V 20 Z" fill="#8a2be2" shape-rendering="crispEdges"/>
     <rect x="16" y="30" width="8" height="12" fill="#0d0417" shape-rendering="crispEdges"/>
  </g>

  <text x="425" y="115" text-anchor="middle" dominant-baseline="middle">
    <tspan class="text-name">&gt; Juliane</tspan><tspan class="text-cursor">_</tspan>
  </text>

  <text x="425" y="175" text-anchor="middle" dominant-baseline="middle" class="text-role">
    Segurança da Informação | <tspan class="text-role-highlight">Cibersegurança</tspan>
  </text>
  <text x="425" y="205" text-anchor="middle" dominant-baseline="middle" class="text-role">
    Governança, Riscos e Compliance
  </text>

</svg>
